name: 2ndKitchen
description: >-
  2ndKitchen was a Chicago-based food-technology startup (Techstars '18) that let
  businesses without an on-site kitchen — bars, breweries, hotels, and apartment
  communities — offer custom food menus sourced from nearby partner restaurants,
  handling ordering, pricing, payment, and delivery on their behalf. The company
  was acquired by REEF Technology in December 2021 and its 2ndkitchen.com domain
  now redirects to reeftechnology.com. This API Evangelist profile captures the
  set of nine microservice OpenAPI definitions still published on the legacy
  Swagger UI at docs.2ndkitchen.com (authentication, business, user, restaurant,
  order, pricing, payment, delivery, and indexing services), preserved here as a
  historical record of the platform's API surface.
