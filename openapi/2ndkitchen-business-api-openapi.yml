            $ref: '#/components/schemas/DeliveryMode'
        tip_options:
          type: array
          items:
            $ref: '#/components/schemas/TipOption'
    BusinessMenuProductCategory:
      type: object
      properties:
        category_id:
          type: integer
          description: category id
        name:
          type: string
          description: category name
        position:
          type: integer
          description: category order position
    BusinessMenu:
      type: object
      properties:
        courier_id:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          description: "Courier Type:\n * `0` - WALKING\n * `1` - TWIN_JET\n * `2` - EATING_IN\n * `4` - TOOKAN\n * `5` - POSTMATES\n * `6` - DOORDASH\n * `7` - SKIPCART\n * `8` - REEF\n * `9` - RELAY\n"
        delivery_fee:
          type: number
          description: ''
        delivery_mode:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          description: "Menu Type:\n * `0` - DIRECT_TO_LOCATION\n * `1` - YAY_FOOD_POLE\n * `2` - PICKUP_AREA\n * `3` - DIRECT_TO_CUSTOMER\n * `4` - LAST_YARD_DELIVERY\n"
        delivery_range:
          type: string
          description: ''
        event_id:
          type: integer
          description: ''
        id:
          type: integer
          description: ''
        is_backup:
          type: integer
          description: ''
          enum:
          - 0
          - 1
        is_late_night:
          type: integer
          description: ''
          enum:
          - 0
          - 1
        min_order_amount:
          type: number
          description: ''
        name:
          type: string
          description: ''
        pre_order_allowed:
          type: integer
          description: ''
          enum:
          - 0
          - 1
        restaurant_commission:
          type: number
          description: ''
        restaurant_id:
          type: integer
          description: ''
        stock_status:
          type: integer
          description: ''
          enum:
          - 0
          - 1
        stock_status_override:
          type: boolean
          description: ''
        theme_id:
          type: integer
          description: ''
        type:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          description: "Menu Type:\n * `0` - DEFAULT\n * `1` - EVENT\n * `2` - EMBEDDED\n * `3` - DONATION\n * `4` - ECOMMERCE\n * `5` - PRE_PACKAGED\n"
        opening_hours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursObj'
        products:
          type: array
          items:
            $ref: '#/components/schemas/BusinessMenuProduct'
        products_categories:
          type: array
          items:
            $ref: '#/components/schemas/BusinessMenuProductCategory'
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        delivery_modes:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryMode'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: In order to use Bond API, each request must be authenticated with an API key. The API key should be sent with each request in the header section with the header
